<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Publication</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
  const params = new URLSearchParams(window.location.search);

  if (params.get("success") === "1") {
    alert("✔ Publication submitted successfully!");
  }
</script>
  
</head>

<body class="bg-gray-100">

  <!-- HEADER -->
  <header class="bg-white shadow p-3 text-center">
    <i data-lucide="book-open" class="w-10 h-10 text-blue-600 mx-auto"></i>
    <h1 class="text-2xl font-bold">Publication Management System</h1>
    <p class="text-gray-500 text-sm">Student & Faculty Research Portal</p>
  </header>

  <!-- BACK -->
  <div class="p-4 max-w-5xl mx-auto">
    <a href="Index.html">
      <button class="flex items-center gap-2 px-4 py-2 rounded hover:bg-gray-200">

        <i data-lucide="arrow-left" class="w-5 h-5"></i>

        Back to Home
      </button>
    </a>
  </div>

  <!-- FORM -->
  <div class="max-w-5xl mx-auto px-4 pb-10">

    <form class="bg-white p-8 rounded-xl shadow"
          action="StudentServlet" method="post">
        

      <h1 class="text-2xl font-bold mb-6">Student Publication Form</h1>

      <!-- STUDENT INFO -->
      <h2 class="text-xl font-semibold mb-2">Student Information</h2>
      <hr class="mb-6">

      <div class="grid md:grid-cols-2 gap-6">

        <input name="full_name" type="text" placeholder="Full Name"
          class="p-3 border rounded-lg bg-gray-50" required>

        <input name="roll_number" type="text" placeholder="Roll Number"
          class="p-3 border rounded-lg bg-gray-50" required>

        <input name="department" type="text" placeholder="Department"
          class="p-3 border rounded-lg bg-gray-50" required>

        <input name="email" type="email" placeholder="Email"
          class="p-3 border rounded-lg bg-gray-50">

      </div>

      <!-- PUBLICATION -->
      <h2 class="text-xl font-semibold mt-10 mb-2">Publication Details</h2>
      <hr class="mb-6">

      <div class="mb-6">
        <select name="publication_type"
          class="w-full p-3 border rounded-lg bg-gray-50" required>
          <option value="" disabled selected>Select Type</option>
          <option>Journal</option>
          <option>Conference</option>
        </select>
      </div>

      <div class="mb-6">
        <input name="title" type="text" placeholder="Publication Title"
          class="w-full p-3 border rounded-lg bg-gray-50" required>
      </div>

      <div class="grid md:grid-cols-2 gap-6 mb-6">

        <input name="journal_name" type="text" placeholder="Journal/Conference Name"
          class="p-3 border rounded-lg bg-gray-50">

        <input name="publication_date" type="date"
          class="p-3 border rounded-lg bg-gray-50 required">

      </div>

		
               
      <button type="submit"
        class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700">
        Submit Publication
      </button>
            

    </form>

  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
