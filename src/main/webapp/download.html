<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Report</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-gray-100 min-h-screen pb-16">

    <!-- HEADER -->
    <header class="bg-white shadow p-3">
        <div class="flex flex-col items-center text-center md:flex-row md:justify-center">
            <i data-lucide="book-open" class="w-12 h-12 text-blue-600"></i>

            <h1 class="text-xl font-bold mt-2 md:mt-0 md:ml-2 md:text-3xl">
                Publication Management System
            </h1>
        </div>

        <p class="text-gray-500 text-sm text-center mt-1">
            Student & Faculty Research Portal
        </p>
    </header>

    <div class="max-w-4xl mx-auto px-4">

        <!-- BACK BUTTON -->
        <div class="p-4 max-w-5xl mx-auto">
    <a href="/Publication_System/Index.html">
      <button class="flex items-center gap-2 px-4 py-2 rounded hover:bg-gray-200">

        <i data-lucide="arrow-left" class="w-5 h-5"></i>

        Back to Home
      </button>
    </a>
  </div>


        <!-- MAIN CARD -->
        <div class="bg-white rounded-2xl shadow py-14 px-8 text-center mt-6 mb-10">

            <!-- ICON -->
            <div class="flex justify-center mb-6">
                <div class="bg-green-100 p-5 rounded-full">
                    <i data-lucide="download" class="w-9 h-9 text-green-600"></i>
                </div>
            </div>

            <!-- TITLE -->
            <h1 class="text-2xl md:text-3xl font-bold mb-3">
                Download Publications Report
            </h1>

            <p class="text-gray-500 mb-8 max-w-xl mx-auto">
                Generate and download a PDF summary of all submitted publications
            </p>

            <!-- DOWNLOAD BUTTON -->
            <a href="DownloadPDFServlet"
                class="inline-flex items-center gap-2 bg-green-600 text-white px-7 py-3 rounded-xl text-lg hover:bg-green-700 transition">

                <i data-lucide="download" class="w-5 h-5"></i>
                Download PDF
            </a>

        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>

</body>

</html>
